spring.application.name=class-work-web-wk3

# --- Redis Connection Settings ---
# Values come from environment variables injected by Docker Compose / .env.
# Safe localhost defaults are used when the variables are not set (e.g. running from an IDE).
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}

# --- PostgreSQL Connection Settings ---
# No credentials are hardcoded here. They are supplied via environment variables
# (see .env.example) and passed through by compose.yaml.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:appdb}
spring.datasource.username=${DB_USER:appuser}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
